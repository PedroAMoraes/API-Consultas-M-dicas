
services:
  
  db:
    image: postgres:16-alpine
    container_name: postgres-alpine-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # networks:
    #   - app-network

  web:
      build: .
      command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
      volumes:
        - .:/app
      ports:
        - "8001:8000"
      env_file:
        - .env
      environment:
        DB_HOST: db
      depends_on:
        db:
          condition: service_healthy
      # networks:
      #   - app-network

# networks:
#   app-network:

volumes:
  pg-data:

