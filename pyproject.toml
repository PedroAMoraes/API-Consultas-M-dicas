[project]
name = "api-consultas-medicas"
version = "0.1.0"
description = "Projeto de API área da saúde."
authors = [
    {name = "PedroAMoraes",email = "pealcantara@hotmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "django (>=6.1.3,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "django-cors-headers (>=4.7.0,<5.0.0)",
    "drf-api-logger (>=1.4.0,<2.0.0)",
    "django-secure (>=1.0.2,<2.0.0)",
    "django-filter (>=26.2,<27.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "flake8 (>=7.5.0,<8.0.0)"
]
